[project]
name = "nixos-gui"
version = "0.2.0"
description = "Minimalist NixOS configuration GUI"
requires-python = ">=3.11"
dependencies = [
    "hyperdiv>=0.1.9",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
nixos-gui = "nixos_gui.__main__:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
